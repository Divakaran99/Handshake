name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the Jac stack
        run: pip install "jaseci==2.3.28"
      - name: Install UI dependencies
        run: jac install
      - name: Type-check every module
        run: bash scripts/check.sh
      - name: Assertion suite (simulator + mock ROS)
        run: jac run verify/run_all.jac
      - name: End-to-end API check
        run: jac run verify/api_e2e.jac
      - name: Reference study
        run: jac run examples/proxemics/build_study.jac
      - name: Build the web client
        run: jac build main.jac
